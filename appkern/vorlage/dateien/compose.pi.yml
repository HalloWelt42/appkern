# __NAME__ auf dem Pi: https://192.168.178.49:__PORT__. Vorne Caddy mit dem Zertifikat der Hausstelle (tools/ausrollen.sh
# stellt es aus), dahinter die App ohne TLS, nur im eigenen Netz erreichbar. Daten in ./daten.
services:
  __KENNUNG__:
    build: .
    image: __KENNUNG__:aktuell
    container_name: __KENNUNG__
    restart: unless-stopped
    user: "1000:1000"
    expose:
      - "8000"
    # Einstellungen, die nicht ins Repo gehören (etwa Adresse und Schlüssel der Leitstelle), stehen nur auf dem Pi
    env_file:
      - path: .env
        required: false
    environment:
      __UMGEBUNG___DATEN: /app/daten
      __UMGEBUNG___CA_DATEI: /zertifikate/rootCA.pem
      # erste Einrichtung von anderswo (Lehre 34): der Code liegt im eingebundenen Datenordner, gefunden auf dem Pi
      __UMGEBUNG___EINRICHTUNGSCODE_DATEI: /app/daten/einrichtungscode
      __UMGEBUNG___EINRICHTUNGSCODE_ORT: "pi@192.168.178.49:/mnt/data/__KENNUNG__/daten/einrichtungscode"
    volumes:
      - ./daten:/app/daten
      - ./zertifikate:/zertifikate:ro
      # Ortszeit des Pi (sonst UTC)
      - /etc/localtime:/etc/localtime:ro

  vorne:
    image: caddy:2.11.6-alpine
    container_name: __KENNUNG__-vorne
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on: [__KENNUNG__]
    ports:
      - "__PORT__:__PORT__"
    environment:
      HAUPTADRESSE: ${HAUPTADRESSE:-192.168.178.49}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./zertifikate:/zertifikate:ro
