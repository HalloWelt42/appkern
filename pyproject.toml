[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appkern"
description = "Appkern: gemeinsame Bausteine der eigenen Apps (Zugang zu Kellerwolke und Leitstelle, Aufträge, Einstellungen)"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
  "pydantic>=2.11",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Schnittstellen für FastAPI-Backends (Router für Aufträge, Protokoll, Einstellungen)
web = ["fastapi>=0.110"]
# Mitteilungen aufs Gerät (Web Push): Schlüssel nach RFC 8292 und Verschlüsselung nach RFC 8291
push = ["py-vapid>=1.9", "http-ece>=1.2"]
# Ton (Modelle und Zugang zum Tondienst; TonHier rechnet mit numpy)
ton = ["numpy>=1.26"]
# Gegenseite des Tondienstes (Wirt auf dem Mac: Klangwerk); ffmpeg und ffprobe kommen vom System
tondienst = ["fastapi>=0.110", "python-multipart>=0.0.9", "numpy>=1.26"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "fastapi>=0.110", "python-multipart>=0.0.9", "numpy>=1.26", "py-vapid>=1.9",
        "http-ece>=1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["appkern*"]

[tool.setuptools.package-data]
"appkern" = ["VERSION", "vorlage/dateien/**/*", "vorlage/dateien/*", "push/dienst.js"]

[tool.setuptools.dynamic]
version = {attr = "appkern.__version__"}
