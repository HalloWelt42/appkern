[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appkern"
description = "Appkern: gemeinsame Bausteine der eigenen Apps (Zugang zu Kellerwolke und Leitstelle, Aufträge, Einstellungen)"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Schnittstellen für FastAPI-Backends (Router für Aufträge, Protokoll, Einstellungen)
web = ["fastapi>=0.110"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "fastapi>=0.110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["appkern*"]

[tool.setuptools.package-data]
"appkern" = ["VERSION", "vorlage/dateien/**/*", "vorlage/dateien/*"]

[tool.setuptools.dynamic]
version = {attr = "appkern.__version__"}
